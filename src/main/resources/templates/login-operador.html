<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do operador | Prensa Rolamentos</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main class="container login-container">
    <section class="panel login-panel">
        <a class="back-link" th:href="@{/menu}">&#8592; Menu principal</a>
        <p class="eyebrow">PRODUÇÃO</p>
        <h1>Login do operador</h1>
        <p class="subtitle">Entre para iniciar e registrar sua operação.</p>
        <p class="login-error" th:if="${erro}" th:text="${erro}"></p>
        <form th:action="@{/producao/login}" method="post">
            <label>Login
                <input type="text" name="login" required autofocus>
            </label>
            <label>Senha
                <input type="password" name="senha" required>
            </label>
            <button class="primary-button" type="submit">Iniciar produção</button>
        </form>
    </section>
</main>
</body>
</html>
