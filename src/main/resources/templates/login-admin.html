<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso administrativo | Prensa Rolamentos</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main class="container login-container">
    <section class="panel login-panel">
        <a class="back-link" th:href="@{/menu}">&#8592; Menu principal</a>
        <p class="eyebrow">PRENSA ROLAMENTOS</p>
        <h1>Acesso administrativo</h1>
            <p class="subtitle">Informe o login e a senha para gerenciar os usuários.</p>
        <p class="login-error" th:if="${erro}" th:text="${erro}"></p>
        <form th:action="@{/usuarios/login}" method="post">
                <label>Login
                    <input type="text" name="login" required autofocus>
                </label>
            <label>Senha de acesso
                <input type="password" name="senha" required autofocus>
            </label>
            <button class="primary-button" type="submit">Entrar</button>
        </form>
    </section>
</main>
</body>
</html>
